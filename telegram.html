<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram · ЖК «Якоби-Парк»</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card messenger-card">
        <a href="index.html" class="back">← Назад</a>
        <div class="messenger-icon telegram">
            <img src="images/icon-telegram.png" alt="Telegram" width="48" height="48">
        </div>
        <p class="messenger-desc">Присоединяйтесь к нашему чату в</p>
        <h1 class="messenger-title">Telegram</h1>
        <div class="qr-wrapper">
            <a href="https://t.me/Yakobi_Park" target="_blank" rel="noopener noreferrer">
                <img src="images/qr-telegram.png" alt="QR-код Telegram" width="200" height="200">
            </a>
        </div>
        <p class="qr-label">
            <strong>Наведите камеру или кликните по QR-коду</strong>
            <br>
            для перехода в общий чат ЖК
        </p>
        <div class="instruction">
            <strong>Чтобы попасть в чат своего дома,</strong><br>
            в общем чате ЖК перейдите в тему <strong>«Чаты домов»</strong>.
        </div>
        <footer class="footer">
            ЖК «Якоби-Парк» • Живу на берегу
        </footer>
    </main>
</body>
</html>
